name: build-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main, develop, banana

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: maven build
        run: mvn install

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

  testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: run test on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: run test on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "No tests are run on this branch, please check logs for more information."
