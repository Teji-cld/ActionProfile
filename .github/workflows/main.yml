name: build-workflow
on:
  push:
    branches:
      - main
  pull-request:
    branches:
      - main, develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: maven build
        run: mvn install

  testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: run test on main branch
        run: mvn test

      - name: checkstyle
        run: mvn checkstyle:checkstyle
